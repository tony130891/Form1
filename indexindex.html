<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is the one</title>
    <link rel="stylesheet" href="stylesForm.css">
</head>
<body>
    
    <div class="main">

        <img src="/halie-west-25xggax4bSA-unsplash.jpg" alt="palm" class="image-left">
            <div class="left-logo">
                <img src="odin-lined.png" alt="Odin">
                    <div class="left-content">
                        <h1>odin</h1>
                    </div>
            </div>


        <div class="form1">

            <form action="" method="post">
                
                <H2>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Vel atque ad rerum quibusdam aspernatur, accusamus et eligendi r</H2>

        <h2>Lets do this</h2>
        
        <div class="names">
            <label for="fname">*FIRTS NAME</label>
            <input type="text" id="fname" name="username" placeholder="Anthony" minlength="3" maxlength="10" required>
            <label for="lname">*LAST NAME</label>
            <input type="text" id="lname" name="userlname" placeholder="hopskin" minlength="3" maxlength="10" required>
        </div>
        
        <div class="contact">
            <label for="email">*EMAIL</label>
            <input type="email" name="useremail" id="email" placeholder="ramona@" minlength="3" maxlength="10" required>
            <label for="phone">*PHONE NUMBER</label>
            <input type="tel" name="phone" id="phone" minlength="3" placeholder="" maxlength="14" required>
        </div>
        

        <div class="passwords">
            <label for="password">*PASSWORD</label>
            <input type="password" id="password" name="password" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
  title="Must contain at least 8 characters, including 1 uppercase, 1 lowercase, 1 number, and 1 special character"  required>
            <label for="confirmation">*CONFIRM PASSWORD</label>
            <input type="password" id="confirmation" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
  title="Must contain at least 8 characters, including 1 uppercase, 1 lowercase, 1 number, and 1 special character"  required>
        </div>
        
        <button class="submit" type="submit">Create Account</button>
        <p>already have an account? <span>Log in</span></p>
    </form>
</div>
    

</div>



<script src="jsform.js"></script>
</body>
</html>
